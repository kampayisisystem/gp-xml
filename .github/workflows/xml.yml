name: GP Kompozit XML

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 06:00 (TR)
  workflow_dispatch:       # elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: xml
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: XML indir
        id: indir
        continue-on-error: true
        env:
          GP_KULLANICI: ${{ secrets.GP_KULLANICI }}
          GP_SIFRE: ${{ secrets.GP_SIFRE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python guncelle.py
      - name: Kaydet
        if: always()
        run: |
          git config user.name "xml-bot"
          git config user.email "xml-bot@users.noreply.github.com"
          # Geçmişi tutma: tek commit, son 5 XML arsiv/ içinde
          git checkout -q --orphan tek
          git add -A
          git commit -q -m "XML $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
          git push -f origin tek:main
      - name: Sonuç
        if: steps.indir.outcome == 'failure'
        run: exit 1
